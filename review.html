<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>起名工具 · 语料审核台</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">LOCAL REVIEW DESK</p><h1>语料审核台</h1><p>只在本机运行。通过审核后，才会进入正式推荐库。</p></div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>
    <section class="filters" aria-label="筛选候选">
      <label>来源 <select id="source"><option value="all">全部来源</option><option value="shijing">诗经</option><option value="chuci">楚辞</option><option value="confucian">儒家经典</option><option value="classics">十三经与诸子</option><option value="philosophy">哲学与先秦古籍</option><option value="tang">唐诗</option><option value="song">宋词</option><option value="wudai">五代词</option><option value="yuanqu">元曲</option><option value="nalan">纳兰词</option><option value="prose">古文与小品</option><option value="wikisource">维基文库《论语》</option></select></label>
      <label>状态 <select id="status"><option value="pending">待审核</option><option value="approved">已通过</option><option value="hold">暂缓</option><option value="rejected">已拒绝</option><option value="all">全部</option></select></label>
      <button id="reload" class="secondary">刷新列表</button>
      <button id="next" class="secondary">下一页</button>
      <button id="publish" class="primary">生成正式语料文件</button>
    </section>
    <p id="notice" class="notice" aria-live="polite"></p>
    <section id="list" class="list" aria-live="polite"></section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-head"><span class="name"></span><span class="state"></span></div>
      <p class="source"></p><blockquote class="quote"></blockquote>
      <div class="meta"></div>
      <div class="checklist"></div>
      <div class="actions"><a class="search" target="_blank" rel="noreferrer">搜索现实使用情况</a><a class="duplicate" target="_blank" rel="noreferrer">官方同名查询</a></div>
      <label>寓意说明（可修改）<textarea class="meaning" rows="3"></textarea></label>
      <label>审核备注（可选）<textarea class="note" rows="2" placeholder="例如：语境正向；现实中可见多人使用。"></textarea></label>
      <div class="decision"><button data-status="approved" class="approve">通过并可发布</button><button data-status="hold">暂缓</button><button data-status="rejected">拒绝</button></div>
    </article>
  </template>
  <script src="review.js"></script>
</body>
</html>
